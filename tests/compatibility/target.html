<!doctype html>
<meta charset="utf-8">
<title>SnipExpand compatibility target</title>
<style>
  :root { color-scheme: dark; font: 20px monospace; }
  body { margin: 2rem; background: #0b1712; color: #d7d5a8; }
  textarea { box-sizing: border-box; width: 100%; height: 80vh; padding: 1rem;
    border: 1px solid #5e9e82; border-radius: 12px; background: #102019;
    color: inherit; font: inherit; }
</style>
<textarea autofocus spellcheck="false" aria-label="Compatibility test input"></textarea>
<script>
  const target = document.querySelector("textarea")
  // Synthetic fixture diagnostics only: F8 arms the next copy to export events.
  const events = []
  let copyEvents = false
  for (const type of ["keydown", "keyup", "beforeinput", "input"]) {
    target.addEventListener(type, event => {
      if (events.length < 5000) events.push({type, time: Date.now(),
        key: event.key, code: event.code, inputType: event.inputType, data: event.data,
        value: target.value, start: target.selectionStart, end: target.selectionEnd})
      if (type === "keydown" && event.key === "F8") {
        event.preventDefault()
        copyEvents = true
      }
    })
  }
  target.addEventListener("copy", event => {
    if (copyEvents) {
      event.preventDefault()
      event.clipboardData.setData("text/plain", JSON.stringify(events))
      copyEvents = false
    }
  })
  addEventListener("load", () => target.focus())
  addEventListener("focus", () => target.focus())
</script>
