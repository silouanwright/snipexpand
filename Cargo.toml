[package]
name = "snipexpand"
version = "0.3.0"
edition = "2021"
description = "Fast, config-based text expansion for Linux and Wayland"
license = "GPL-3.0-or-later"
repository = "https://github.com/silouanwright/snipexpand"
keywords = ["wayland", "text-expander", "evdev", "uinput", "linux"]
categories = ["command-line-utilities"]
readme = "README.md"
exclude = [".github", "docs"]

[[bin]]
name = "snipexpand"
path = "src/main.rs"

[[bin]]
name = "sxp"
path = "src/bin/sxp.rs"

[dependencies]
# Input reading
evdev = { version = "0.13", features = ["tokio"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-stream = "0.1"

# Wayland (for XKB keymap retrieval only)
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }

# XKB keyboard layout
xkbcommon = "0.9"

# Config
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
tempfile = "3"

# CLI
clap = { version = "4", features = ["derive"] }

# File watching
notify = "8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Unix primitives
nix = { version = "0.31", features = ["signal", "fs"] }

# Error handling
anyhow = "1"

# System calls
libc = "0.2"

[profile.release]
strip = true
opt-level = "z"
lto = true
