name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build-x86_64:
    name: Build (x86_64-linux)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Build release binary
        run: cargo build --release

      - name: Package artifact
        run: |
          cp target/release/snipexpand "snipexpand-x86_64-linux"
          sha256sum "snipexpand-x86_64-linux" > "snipexpand-x86_64-linux.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: x86_64-linux
          path: |
            snipexpand-x86_64-linux
            snipexpand-x86_64-linux.sha256

  build-aarch64:
    name: Build (aarch64-linux)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Build release binary
        run: cargo build --release

      - name: Package artifact
        run: |
          cp target/release/snipexpand "snipexpand-aarch64-linux"
          sha256sum "snipexpand-aarch64-linux" > "snipexpand-aarch64-linux.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-linux
          path: |
            snipexpand-aarch64-linux
            snipexpand-aarch64-linux.sha256

  github-release:
    name: GitHub Release
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download x86_64 artifact
        uses: actions/download-artifact@v8
        with:
          name: x86_64-linux

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v8
        with:
          name: aarch64-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            snipexpand-x86_64-linux
            snipexpand-x86_64-linux.sha256
            snipexpand-aarch64-linux
            snipexpand-aarch64-linux.sha256

  publish-crates:
    name: Publish to crates.io
    needs: [github-release]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
