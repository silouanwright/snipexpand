name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            cmake \
            fcitx5-modules-dev \
            libfcitx5core-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config

      - name: Build and test Fcitx5 bridge
        run: |
          cmake -S fcitx5-addon -B target/fcitx5-addon
          cmake --build target/fcitx5-addon
          ctest --test-dir target/fcitx5-addon --output-on-failure

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test
